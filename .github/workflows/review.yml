name: Review

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

jobs:
  review:
    name: Build review
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      DEBIAN_FRONTEND: noninteractive
      CMAKE_BUILD_PARALLEL_LEVEL: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install build tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            curl \
            ca-certificates \
            git

      - name: Pull Git LFS assets
        shell: bash
        run: |
          set -euo pipefail
          git lfs pull

      - name: Resolve Toradex toolchain installer
        shell: bash
        env:
          TDX_TOOLCHAIN_URL: ${{ secrets.TDX_TOOLCHAIN_URL }}
        run: |
          set -euo pipefail

          TOOLCHAIN_PATH=""

          for candidate in \
            "${GITHUB_WORKSPACE}/SDK_for_C_Compilation/tdx-xwayland-glibc-x86_64-cnr-image-ml-armv8a-verdin-imx8mp-toolchain-7.5.0.sh" \
            ${GITHUB_WORKSPACE}/SDK_for_C_Compilation/*.sh; do
            if [ -f "$candidate" ]; then
              if head -n 3 "$candidate" | grep -q "git-lfs.github.com/spec/v1"; then
                echo "Git LFS pointer detected in $candidate."
                echo "The real toolchain binary has not been uploaded or is not available in the checkout."
                echo "Push the real .sh installer through Git LFS or provide a direct-download URL via TDX_TOOLCHAIN_URL."
                exit 1
              fi
              TOOLCHAIN_PATH="$candidate"
              break
            fi
          done

          if [ -z "$TOOLCHAIN_PATH" ] && [ -n "${TDX_TOOLCHAIN_URL:-}" ]; then
            mkdir -p "$RUNNER_TEMP/tdx-sdk"
            curl -L --fail --retry 3 \
              -o "$RUNNER_TEMP/tdx-sdk/toolchain.sh" \
              "$TDX_TOOLCHAIN_URL"
            TOOLCHAIN_PATH="$RUNNER_TEMP/tdx-sdk/toolchain.sh"
          fi

          if [ -n "$TOOLCHAIN_PATH" ]; then
            echo "Found Toradex SDK installer at: $TOOLCHAIN_PATH"
            echo "TOOLCHAIN_PATH=$TOOLCHAIN_PATH" >> "$GITHUB_ENV"
          else
            echo "No Toradex SDK installer was found in the repository and no TDX_TOOLCHAIN_URL secret is configured."
            echo "The workflow will skip the build until one of these is available:"
            echo "  - a direct-download .sh installer inside SDK_for_C_Compilation/"
            echo "  - a valid TDX_TOOLCHAIN_URL repository secret"
            echo "TOOLCHAIN_PATH=" >> "$GITHUB_ENV"
          fi

      - name: Toolchain not available
        if: ${{ env.TOOLCHAIN_PATH == '' }}
        shell: bash
        run: |
          echo "Skipping build because the Toradex SDK installable is not available in this environment."

      - name: Install Toradex SDK
        if: ${{ env.TOOLCHAIN_PATH != '' }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "${TOOLCHAIN_PATH:-}"
          chmod +x "${TOOLCHAIN_PATH}"

          sudo mkdir -p /opt/tdx-xwayland

          if [ -f /opt/tdx-xwayland/7.5.0/environment-setup-armv8a-tdx-linux ]; then
            echo "Toradex SDK already installed at /opt/tdx-xwayland/7.5.0"
          else
            echo "Installing Toradex SDK..."
            sudo bash "${TOOLCHAIN_PATH}" -y -d /opt/tdx-xwayland/7.5.0
          fi

          if [ ! -f /opt/tdx-xwayland/7.5.0/environment-setup-armv8a-tdx-linux ]; then
            echo "::error::The Toradex SDK installer did not create the expected environment script."
            exit 1
          fi

      - name: Build mbedTLS for target
        if: ${{ env.TOOLCHAIN_PATH != '' }}
        shell: bash
        run: |
          set -euo pipefail
          source /opt/tdx-xwayland/7.5.0/environment-setup-armv8a-tdx-linux

          mkdir -p "$HOME/tools"
          git clone --depth 1 --branch v3.6.2 --recurse-submodules https://github.com/Mbed-TLS/mbedtls.git "$RUNNER_TEMP/mbedtls"
          git -C "$RUNNER_TEMP/mbedtls" submodule update --init --recursive

          cmake -S "$RUNNER_TEMP/mbedtls" -B "$RUNNER_TEMP/mbedtls/build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DENABLE_PROGRAMS=OFF \
            -DENABLE_TESTING=OFF \
            -DCMAKE_INSTALL_PREFIX="$HOME/tools/mbedtls-aarch64"

          cmake --build "$RUNNER_TEMP/mbedtls/build" --parallel
          cmake --install "$RUNNER_TEMP/mbedtls/build"

      - name: Build libwebsockets with mbedTLS support
        if: ${{ env.TOOLCHAIN_PATH != '' }}
        shell: bash
        run: |
          set -euo pipefail
          source /opt/tdx-xwayland/7.5.0/environment-setup-armv8a-tdx-linux
          export PKG_CONFIG_PATH="$HOME/tools/mbedtls-aarch64/lib/pkgconfig:${PKG_CONFIG_PATH:-}"

          git clone --depth 1 --branch v4.3.5 https://github.com/warmcat/libwebsockets.git "$RUNNER_TEMP/libwebsockets"

          cmake -S "$RUNNER_TEMP/libwebsockets" -B "$RUNNER_TEMP/libwebsockets/build" \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DLWS_WITH_MBEDTLS=ON \
            -DLWS_WITH_SSL=ON \
            -DLWS_WITH_SHARED=ON \
            -DLWS_WITH_STATIC=OFF \
            -DLWS_WITHOUT_TESTAPPS=ON \
            -DLWS_WITHOUT_TEST_SERVER=ON \
            -DCMAKE_INSTALL_PREFIX="$HOME/tools/lws-aarch64-mbedtls" \
            -DCMAKE_PREFIX_PATH="$HOME/tools/mbedtls-aarch64"

          cmake --build "$RUNNER_TEMP/libwebsockets/build" --parallel
          cmake --install "$RUNNER_TEMP/libwebsockets/build"

      - name: Validate required dependency paths
        if: ${{ env.TOOLCHAIN_PATH != '' }}
        shell: bash
        run: |
          set -euo pipefail
          source /opt/tdx-xwayland/7.5.0/environment-setup-armv8a-tdx-linux

          for path in \
            "$HOME/tools/lws-aarch64-mbedtls/lib/pkgconfig/libwebsockets.pc" \
            "$HOME/tools/mbedtls-aarch64/include/mbedtls/ssl.h" \
            "$HOME/tools/mbedtls-aarch64/lib/libmbedtls.so" \
            "/opt/tdx-xwayland/7.5.0/sysroots/armv8a-tdx-linux/usr/include/tensorflow/lite"; do
            if [ ! -e "$path" ]; then
              echo "::warning::Missing expected dependency: $path"
            fi
          done

      - name: Configure and build project
        if: ${{ env.TOOLCHAIN_PATH != '' }}
        shell: bash
        run: |
          set -euo pipefail
          source /opt/tdx-xwayland/7.5.0/environment-setup-armv8a-tdx-linux

          unset PKG_CONFIG_SYSROOT_DIR
          export PKG_CONFIG_PATH="$HOME/tools/mbedtls-aarch64/lib/pkgconfig:$HOME/tools/lws-aarch64-mbedtls/lib/pkgconfig:${PKG_CONFIG_PATH:-}"

          test -f "$HOME/tools/lws-aarch64-mbedtls/lib/pkgconfig/libwebsockets.pc"
          test -f "$HOME/tools/mbedtls-aarch64/include/mbedtls/ssl.h"
          test -f "$HOME/tools/mbedtls-aarch64/lib/libmbedtls.so"
          pkg-config --exists libwebsockets
          echo "libwebsockets pkg-config data:"
          pkg-config --cflags --libs libwebsockets

          rm -rf build
          cmake -S . -B build \
            -DMBEDTLS_INCLUDE_DIR="$HOME/tools/mbedtls-aarch64/include" \
            -DMBEDTLS_LIB_DIR="$HOME/tools/mbedtls-aarch64/lib" \
            -DTFLITE_INCLUDE_DIR="/opt/tdx-xwayland/7.5.0/sysroots/armv8a-tdx-linux/usr/include" \
            -DTFLITE_LIB_DIR="/opt/tdx-xwayland/7.5.0/sysroots/armv8a-tdx-linux/usr/lib"

          cmake --build build --parallel

      - name: Upload built artifact
        if: ${{ success() && env.TOOLCHAIN_PATH != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: controller_bridge
          path: build/controller_bridge
          if-no-files-found: error
